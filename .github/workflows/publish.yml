# Два рилса Алины в день (12:00 и 19:00 МСК) в Instagram и YouTube Shorts — на серверах GitHub (компьютер не нужен).
# Расписание GitHub бывает с опозданием или пропуском, поэтому запасные попытки в :07 и :37
# (дневной — до 16:37, вечерний — до 22:37). Если в этом окне рилс уже вышел — запуск сразу заканчивается.
name: publish

on:
  schedule:
    - cron: "0 9 * * *"         # 12:00 МСК — дневной рилс
    - cron: "7,37 9-13 * * *"   # запасные: 12:07 … 16:37 МСК (GitHub часто теряет запуски)
    - cron: "0 16 * * *"        # 19:00 МСК — вечерний рилс
    - cron: "7,37 16-19 * * *"  # запасные: 19:07 … 22:37 МСК
  workflow_dispatch:
    inputs:
      mode:
        description: "next | dry-run | check | force"
        required: true
        default: dry-run

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Публикация
        run: |
          # свежая очередь: запасной запуск должен видеть, что основной уже выложил рилс
          git fetch -q origin main && git reset -q --hard origin/main
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            check) python ig_publish.py check ;;
            dry-run) python ig_publish.py next --dry-run ;;
            force) python ig_publish.py next --force ;;
            *) python ig_publish.py next ;;
          esac

      - name: YouTube Shorts (тот же рилс, что сегодня вышел в Instagram)
        if: always() && inputs.mode != 'check'
        continue-on-error: true
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then python yt_publish.py today --dry-run; else python yt_publish.py today; fi

      - name: Записать, что вышло
        if: always()
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "alina-bot"
            git config user.email "alina-bot@users.noreply.github.com"
            git add queue.json
            git commit -q -m "Опубликован рилс $(date -u +%F)"
            git push -q
          fi

      - name: Сообщить о сбое в бота
        if: failure()
        run: |
          python tg_send.py --caption "⚠️ Instagram Алины: публикация не прошла. Журнал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
