# Ежедневный рилс Алины в Instagram — на серверах GitHub (компьютер не нужен).
# Расписание GitHub бывает с опозданием или пропуском, поэтому много попыток: 15:00, затем в :07 и :37 до 20:37 МСК.
# Если сегодня рилс уже вышел — запуск сразу заканчивается (повторов не будет).
name: publish

on:
  schedule:
    - cron: "0 12 * * *"        # 15:00 МСК — основная
    - cron: "7,37 12-17 * * *"  # запасные: 15:07, 15:37 … 20:37 МСК (GitHub часто теряет запуски)
  workflow_dispatch:
    inputs:
      mode:
        description: "next | dry-run | check | force"
        required: true
        default: dry-run

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Публикация
        run: |
          # свежая очередь: запасной запуск должен видеть, что основной уже выложил рилс
          git fetch -q origin main && git reset -q --hard origin/main
          MODE="${{ inputs.mode }}"
          case "$MODE" in
            check) python ig_publish.py check ;;
            dry-run) python ig_publish.py next --dry-run ;;
            force) python ig_publish.py next --force ;;
            *) python ig_publish.py next ;;
          esac

      - name: Записать, что вышло
        if: always()
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "alina-bot"
            git config user.email "alina-bot@users.noreply.github.com"
            git add queue.json
            git commit -q -m "Опубликован рилс $(date -u +%F)"
            git push -q
          fi

      - name: Сообщить о сбое в бота
        if: failure()
        run: |
          python tg_send.py --caption "⚠️ Instagram Алины: публикация не прошла. Журнал: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
